name: Publish release packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag
        required: true
        type: string
      dry_run:
        description: Verify assets and registry state only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-package-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'geyaovip/zhixing-ark-dsh-plugins' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Select a stable release and download assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -- "$RELEASE_TAG" |
            jq -e '(.isDraft or .isPrerelease) | not' >/dev/null
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/npm-release" \
            --pattern '*.tgz' --pattern SHA256SUMS.txt -- "$RELEASE_TAG"
      - name: Verify and publish packages
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          npm install --global npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org
          node .github/scripts/publish-npm.mjs "$RUNNER_TEMP/npm-release"
